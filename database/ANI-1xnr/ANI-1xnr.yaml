name: ANI-1xnr
year: 2024
category: Benchmarks
license: CC0
minimum_load_atoms_version: 0.3
format: lmdb
description: |
    The ANI-1ccx dataset comprises an "optimally spanning" subset of the :doc:`/datasets/ANI-1x` dataset,
    with each structure being re-labelled with the total structure energy using the 
    "gold standard" CCSD(T)/CBS level of theory. Internally, files are downloaded from
    `FigShare <https://springernature.figshare.com/articles/dataset/Exploring_the_frontiers_of_condensed-phase_chemistry_with_a_general_reactive_machine_learning_potential/22814579?file=43190004>`__.
citation: |
    @article{Zhang-24-03,
        title = {
            Exploring the frontiers of condensed-phase 
            chemistry with a general reactive machine learning potential
        },
        author = {
            Zhang, Shuhao and Makoś, Małgorzata Z. and Jadrich, Ryan B. and Kraka, 
            Elfi and Barros, Kipton and Nebgen, Benjamin T. and Tretiak, Sergei and Isayev, 
            Olexandr and Lubbers, Nicholas and Messerly, Richard A. and Smith, Justin S.
        },
        year = {2024},
        journal = {Nature Chemistry},
        volume = {16},
        number = {5},
        pages = {727-734},
        doi = {10.1038/s41557-023-01427-3},
    }

per_atom_properties:
    dft_forces:
        desc: force vectors (as labelled with :math:`\omega`\ B97x/6-31G(d))
        units: eV/Å
per_structure_properties:
    cc_energy:
        desc: energy of the structure (as labelled with CCSD(T)/CBS)
        units: eV
    dft_energy:
        desc: energy of the structure (as labelled with :math:`\omega`\ B97x/6-31G(d))
        units: eV
    dft_dipole:
        desc: dipole moment of the structure (as labelled with :math:`\omega`\ B97x/6-31G(d))
        units: e Å
    1x_idx:
        desc: index of the structure in the :doc:`/datasets/ANI-1x` dataset

representative_structure: 100_000

